name: 'coverage'
on:
  pull_request:
    branches:
      - master
      - main
jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Node'
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: 'Install Deps'
        run: npm ci
      - name: 'Test'
        run: npx vitest --coverage.enabled true
      - name: 'Report Coverage'
        uses:  davelosert/vitest-coverage-report-action@v2
